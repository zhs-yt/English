<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英语听写助手</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #b5cde0;
            height: 100vh;
            height: 100dvh; /* 兼容手机浏览器地址栏收缩 */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 主界面 */
        #main-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        #corner-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.2s;
            padding: 10px;
            z-index: 10;
        }

        #corner-btn:active {
            opacity: 0.5;
        }

        #word-display {
            text-align: center;
            color: #ffffff;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            word-break: break-word;
        }

        .english {
            font-size: 36px;
            font-weight: 400;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .chinese {
            font-size: 28px;
            font-weight: 300;
            opacity: 0.95;
        }

        .placeholder-text {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        #refresh-btn {
            position: absolute;
            bottom: 120px;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            padding: 12px 40px;
            border-radius: 6px;
            transition: background 0.2s;
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.1);
        }

        #refresh-btn:active {
            background: rgba(255, 255, 255, 0.3);
            opacity: 1;
        }

        /* 词库管理弹窗 */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #modal {
            background: #ffffff;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            color: #333;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 500;
        }

        .close-btn {
            cursor: pointer;
            color: #999;
            font-size: 28px;
            line-height: 1;
            padding: 0 5px;
        }

        .close-btn:active {
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            min-width: 0;
        }

        .input-group input:focus {
            border-color: #b5cde0;
        }

        .btn {
            padding: 10px 16px;
            background-color: #b5cde0;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .btn:active {
            background-color: #9bb8d1;
        }

        .btn.danger {
            background-color: #e07a7a;
        }

        .btn.danger:active {
            background-color: #cc6666;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 6px;
            margin: 10px 0;
            padding: 8px;
            background: #fafafa;
            min-height: 150px;
            -webkit-overflow-scrolling: touch;
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #b5cde0;
        }

        .list-item .en {
            font-weight: 500;
            margin-right: 8px;
            flex: 1;
            word-break: break-all;
        }

        .list-item .zh {
            color: #666;
            flex: 1;
            text-align: right;
            word-break: break-all;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 13px;
            color: #888;
        }

        .toolbar label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 5px;
        }

        .toolbar input[type="checkbox"] {
            margin-right: 6px;
            accent-color: #b5cde0;
            width: 16px;
            height: 16px;
        }

        .list-container::-webkit-scrollbar {
            width: 6px;
        }
        .list-container::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        /* 手机端适配 */
        @media (max-width: 480px) {
            .english { font-size: 32px; }
            .chinese { font-size: 24px; }
            #modal { width: 95%; padding: 16px; }
            .input-group { flex-direction: column; gap: 8px; }
            .input-group .btn { width: 100%; }
            .toolbar { flex-wrap: wrap; gap: 8px; }
            .toolbar span { order: 3; width: 100%; text-align: center; margin-top: 5px; }
            #refresh-btn { bottom: 80px; }
            #corner-btn { top: 15px; left: 15px; }
        }
    </style>
</head>
<body>

    <!-- 主展示界面 -->
    <div id="main-screen">
        <div id="corner-btn">词库</div>
        
        <div id="word-display">
            <div class="placeholder-text">点击下方刷新开始听写</div>
        </div>

        <div id="refresh-btn">刷 新</div>
    </div>

    <!-- 词库管理弹窗 -->
    <div id="modal-overlay">
        <div id="modal">
            <div class="modal-header">
                <span>词库管理</span>
                <span class="close-btn" id="close-modal">&times;</span>
            </div>

            <!-- 单条添加 -->
            <div class="input-group">
                <input type="text" id="input-en" placeholder="英文 (如: apple)" autocomplete="off" autocapitalize="none" spellcheck="false">
                <input type="text" id="input-zh" placeholder="中文 (如: 苹果)" autocomplete="off">
                <button class="btn" id="add-single-btn">添加</button>
            </div>

            <!-- 批量添加 -->
            <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-direction: column;">
                <textarea id="input-batch" placeholder="批量粘贴，格式如：&#10;apple 苹果&#10;banana 香蕉&#10;（每行一个，中间用空格或逗号隔开）" style="width:100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; resize: vertical; min-height: 70px; outline: none; font-family: inherit;"></textarea>
                <button class="btn" id="add-batch-btn" style="align-self: flex-end;">批量导入</button>
            </div>

            <!-- 单词列表 -->
            <div class="list-container" id="word-list">
                <!-- 动态渲染列表 -->
            </div>

            <!-- 底部操作栏 -->
            <div class="toolbar">
                <label>
                    <input type="checkbox" id="select-all"> 全选
                </label>
                <span id="word-count" style="font-size: 13px;">共 0 个单词</span>
                <button class="btn danger" id="delete-selected-btn" style="padding: 6px 12px; font-size: 12px;">删除勾选</button>
            </div>
        </div>
    </div>

    <script>
        // --- 数据层 ---
        const STORAGE_KEY = 'dictation_words';
        
        // 初始化数据
        let words = [];
        try {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                words = JSON.parse(stored);
            }
        } catch (e) {
            console.error('读取本地存储失败', e);
        }

        // 如果为空，给几条默认数据方便测试
        if (words.length === 0) {
            words = [
                { en: 'apple', zh: '苹果' },
                { en: 'banana', zh: '香蕉' },
                { en: 'orange', zh: '橙子' }
            ];
            saveToStorage();
        }

        // 保存数据
        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
            renderList();
            updateCount();
        }

        // --- DOM 元素 ---
        const wordDisplay = document.getElementById('word-display');
        const refreshBtn = document.getElementById('refresh-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const cornerBtn = document.getElementById('corner-btn');
        const closeModal = document.getElementById('close-modal');
        const inputEn = document.getElementById('input-en');
        const inputZh = document.getElementById('input-zh');
        const addSingleBtn = document.getElementById('add-single-btn');
        const inputBatch = document.getElementById('input-batch');
        const addBatchBtn = document.getElementById('add-batch-btn');
        const wordList = document.getElementById('word-list');
        const selectAllCheckbox = document.getElementById('select-all');
        const deleteSelectedBtn = document.getElementById('delete-selected-btn');
        const wordCount = document.getElementById('word-count');

        // --- 交互逻辑 ---

        // 1. 刷新随机单词
        function refreshWord() {
            if (words.length === 0) {
                wordDisplay.innerHTML = '<div class="placeholder-text">词库为空，请点击左上角词库添加</div>';
                return;
            }
            const randomIndex = Math.floor(Math.random() * words.length);
            const word = words[randomIndex];
            wordDisplay.innerHTML = `
                <div class="english">${word.en}</div>
                <div class="chinese">${word.zh}</div>
            `;
        }

        refreshBtn.addEventListener('click', refreshWord);

        // 2. 打开/关闭 词库管理
        cornerBtn.addEventListener('click', () => {
            modalOverlay.style.display = 'flex';
            renderList();
        });

        closeModal.addEventListener('click', () => {
            modalOverlay.style.display = 'none';
        });

        // 点击遮罩层也关闭
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.style.display = 'none';
            }
        });

        // 3. 添加单词 - 单条
        addSingleBtn.addEventListener('click', () => {
            const en = inputEn.value.trim();
            const zh = inputZh.value.trim();
            if (!en || !zh) return alert('请完整输入英文和中文');
            
            // 检查是否重复
            if (words.some(w => w.en.toLowerCase() === en.toLowerCase())) {
                if (!confirm(`单词 "${en}" 已存在，是否继续添加？`)) return;
            }

            words.push({ en, zh });
            saveToStorage();
            inputEn.value = '';
            inputZh.value = '';
            inputEn.focus();
        });

        // 4. 添加单词 - 批量
        addBatchBtn.addEventListener('click', () => {
            const raw = inputBatch.value.trim();
            if (!raw) return;
            
            const lines = raw.split('\\n');
            let addedCount = 0;
            let skippedCount = 0;
            
            lines.forEach(line => {
                // 兼容空格和逗号分隔
                const parts = line.trim().split(/[\\s,，]+/);
                if (parts.length >= 2) {
                    const en = parts[0].trim();
                    const zh = parts.slice(1).join(' ').trim();
                    if (en && zh) {
                        // 去重检查
                        if (!words.some(w => w.en.toLowerCase() === en.toLowerCase())) {
                            words.push({ en, zh });
                            addedCount++;
                        } else {
                            skippedCount++;
                        }
                    }
                }
            });

            if (addedCount > 0) {
                saveToStorage();
                inputBatch.value = '';
                alert(`成功导入 ${addedCount} 个新单词${skippedCount > 0 ? `，跳过 ${skippedCount} 个已存在的单词` : ''}`);
            } else {
                alert('没有导入任何单词，请检查格式（如：apple 苹果）或单词已存在');
            }
        });

        // 5. 渲染列表
        function renderList() {
            if (words.length === 0) {
                wordList.innerHTML = '<div style="color: #999; text-align: center; padding: 20px; font-size: 13px;">暂无单词</div>';
                selectAllCheckbox.checked = false;
                return;
            }

            let html = '';
            words.forEach((word, index) => {
                html += `
                    <div class="list-item">
                        <input type="checkbox" class="word-checkbox" data-index="${index}">
                        <span class="en">${word.en}</span>
                        <span class="zh">${word.zh}</span>
                    </div>
                `;
            });
            wordList.innerHTML = html;

            // 重新绑定复选框事件
            document.querySelectorAll('.word-checkbox').forEach(cb => {
                cb.addEventListener('change', updateSelectAllState);
            });
            updateSelectAllState();
        }

        // 6. 更新全选状态
        function updateSelectAllState() {
            const checkboxes = document.querySelectorAll('.word-checkbox');
            if (checkboxes.length === 0) return;
            const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            selectAllCheckbox.checked = checkedCount === checkboxes.length;
            selectAllCheckbox.indeterminate = checkedCount > 0 && checkedCount < checkboxes.length;
        }

        // 全选/取消全选
        selectAllCheckbox.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            document.querySelectorAll('.word-checkbox').forEach(cb => {
                cb.checked = isChecked;
            });
        });

        // 7. 删除勾选
        deleteSelectedBtn.addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.word-checkbox:checked');
            if (checkboxes.length === 0) return alert('请先勾选要删除的单词');

            if (!confirm(`确定要删除选中的 ${checkboxes.length} 个单词吗？`)) return;

            const indicesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.dataset.index)).sort((a, b) => b - a);
            
            indicesToDelete.forEach(index => {
                words.splice(index, 1);
            });

            saveToStorage();
            selectAllCheckbox.checked = false;
        });

        // 8. 更新计数
        function updateCount() {
            wordCount.textContent = `共 ${words.length} 个单词`;
        }

        // 初始化渲染列表
        renderList();
        updateCount();
    </script>
</body>
</html>
